<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0"></script>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="js/index.js" type="text/javascript" defer></script>
    <title>Testone</title>
</head>
<body>
    <h3>Stato corrente: <p id="statusText"></p></h3>
    <h3>Apertura corrente: <p id="openingText"></p></h3>
    <h3>Cambia modalità</h3>
    <form action="#">
        <button id="switch_mode">Manuale</button></br>
        <label for="opening">Apertura valvola: <input type="range" min="0" max="100" step="1" value="50" id="opening" name="opening" disabled="true"/></label>
        <label for="currentOpening">Apertura letta: <input type="number" name="currentOpening" id="currentOpening" disabled="true"/></label>
        <input type="submit" value="Conferma apertura" id="setOpening" disabled="true" />
    </form>
    <div id="chartArea">
        <canvas id="waterGraph" style="width: 100%;"></canvas>
    </div>

    <div id="charticus" style="width: 100%;"></div>

    
</body>
</html>
